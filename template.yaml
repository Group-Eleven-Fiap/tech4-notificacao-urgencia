AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tech Challenge Fase 4 - Notificacao de avaliacoes criticas (SQS -> Lambda -> SES)

Parameters:
  AdminEmail:
    Type: String
    Description: E-mail do administrador, verificado no SES enquanto a conta estiver em sandbox
  EmailRemetente:
    Type: String
    Description: E-mail remetente, verificado no SES

Resources:
  FilaNotificacoesCriticasDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: filas-notificacoes-criticas-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  FilaNotificacoesCriticas:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: filas-notificacoes-criticas
      SqsManagedSseEnabled: true
      # A AWS recomenda pelo menos 6x o timeout da funcao (30s)
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FilaNotificacoesCriticasDLQ.Arn
        maxReceiveCount: 3

  PoliticaFilasSomenteTls:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FilaNotificacoesCriticas
        - !Ref FilaNotificacoesCriticasDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NegarAcessoSemTls
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource:
              - !GetAtt FilaNotificacoesCriticas.Arn
              - !GetAtt FilaNotificacoesCriticasDLQ.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  NotificacaoUrgenciaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/notificacao-urgencia
      RetentionInDays: 14

  NotificacaoUrgenciaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: menor-privilegio
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConsumirFila
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FilaNotificacoesCriticas.Arn
              # Em sandbox, o SES tambem autoriza contra a identidade do destinatario
              - Sid: EnviarEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailRemetente}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${AdminEmail}
              - Sid: EscreverLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt NotificacaoUrgenciaLogGroup.Arn
              - Sid: EnviarTracesXRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  NotificacaoUrgenciaFunction:
    Type: AWS::Serverless::Function
    DependsOn: NotificacaoUrgenciaLogGroup
    Properties:
      FunctionName: notificacao-urgencia
      Description: Consome avaliacoes criticas da SQS e notifica o administrador por e-mail
      CodeUri: .
      Handler: notificacao_urgencia.handler.NotificacaoUrgenciaHandler::handleRequest
      Runtime: java21
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt NotificacaoUrgenciaRole.Arn
      Tracing: Active
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          EMAIL_REMETENTE: !Ref EmailRemetente
      Events:
        AvaliacaoCritica:
          Type: SQS
          Properties:
            Queue: !GetAtt FilaNotificacoesCriticas.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  TopicoAlarmes:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: notificacao-urgencia-alarmes
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail

  # Falhas parciais de lote nao aparecem na metrica Errors da Lambda
  FiltroFalhasNotificacao:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NotificacaoUrgenciaLogGroup
      FilterPattern: '"notificacao.falha"'
      MetricTransformations:
        - MetricNamespace: TechChallenge/Notificacao
          MetricName: FalhasNotificacao
          MetricValue: '1'
          DefaultValue: 0

  AlarmeFalhasNotificacao:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notificacao-urgencia-falhas
      AlarmDescription: Mensagens que falharam ao gerar o e-mail de urgencia
      Namespace: TechChallenge/Notificacao
      MetricName: FalhasNotificacao
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TopicoAlarmes

  AlarmeErrosLambda:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notificacao-urgencia-erros-lambda
      AlarmDescription: Execucoes da Lambda encerradas com erro
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificacaoUrgenciaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TopicoAlarmes

  AlarmeMensagensNaDLQ:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notificacao-urgencia-dlq
      AlarmDescription: Avaliacoes criticas que esgotaram as tentativas e nao geraram e-mail
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FilaNotificacoesCriticasDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TopicoAlarmes

  DashboardNotificacao:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: notificacao-urgencia
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: invocacoes e erros", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "notificacao-urgencia"],
                  [".", "Errors", ".", "."],
                  ["TechChallenge/Notificacao", "FalhasNotificacao"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: duracao (ms)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
                "metrics": [["AWS/Lambda", "Duration", "FunctionName", "notificacao-urgencia"]]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 24, "height": 6,
              "properties": {
                "title": "SQS: mensagens na fila e na DLQ", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "filas-notificacoes-criticas"],
                  ["...", "filas-notificacoes-criticas-dlq"]
                ]
              }
            }
          ]
        }

Outputs:
  FilaNotificacoesCriticasUrl:
    Description: Valor de SQS_QUEUE_URL na Lambda ingestao-avaliacao
    Value: !Ref FilaNotificacoesCriticas
    Export:
      Name: tech4-filas-notificacoes-criticas-url
  FilaNotificacoesCriticasArn:
    Description: ARN para conceder sqs:SendMessage a role da ingestao-avaliacao
    Value: !GetAtt FilaNotificacoesCriticas.Arn
    Export:
      Name: tech4-filas-notificacoes-criticas-arn
  FilaDlqUrl:
    Description: URL da DLQ
    Value: !Ref FilaNotificacoesCriticasDLQ
  FuncaoNome:
    Description: Nome da funcao
    Value: !Ref NotificacaoUrgenciaFunction
